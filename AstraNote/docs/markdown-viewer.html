<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AstraNotes Document Viewer</title>
  <style>
    :root {
      --bg: #f4efec;
      --surface: #ffffff;
      --surface-2: #f8f4f1;
      --text: #1f2c3a;
      --muted: #617080;
      --line: #e7ddd8;
      --accent: #285f8f;
      --accent-2: #d06e42;
      --shadow: 0 14px 36px rgba(39, 31, 28, 0.08);
      --code-bg: #162230;
      --code-text: #f3f7fb;
      --table-head: #f2f7fb;
      --note: #fff8f1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top right, rgba(208, 110, 66, 0.14), transparent 28%),
        linear-gradient(180deg, #f8f2ef 0%, var(--bg) 100%);
      color: var(--text);
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      line-height: 1.6;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px;
    }

    .hero {
      background: linear-gradient(120deg, #24476f 0%, #2b628f 56%, #cf754d 100%);
      color: #f5f8fb;
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      right: -60px;
      top: -80px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.22), rgba(255,255,255,0));
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 1.8px;
      font-size: 0.78rem;
      font-weight: 700;
      opacity: 0.86;
    }

    h1 {
      margin: 8px 0 10px;
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 0.98;
      max-width: 14ch;
    }

    .hero p {
      margin: 0;
      max-width: 72ch;
      color: rgba(245, 248, 251, 0.92);
    }

    .hero-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
      position: relative;
      z-index: 1;
    }

    .hero-meta {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(245, 248, 251, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: rgba(245, 248, 251, 0.94);
      font-size: 0.9rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 0.95rem;
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      background: rgba(255,255,255,0.14);
      backdrop-filter: blur(4px);
    }

    .btn.secondary {
      background: rgba(16, 26, 37, 0.16);
    }

    .viewer {
      margin-top: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .viewer-head {
      padding: 14px 18px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.92rem;
    }

    .content {
      padding: 28px 24px 34px;
    }

    .content h1,
    .content h2,
    .content h3,
    .content h4,
    .content h5,
    .content h6 {
      color: #203347;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-top: 1.6em;
      margin-bottom: 0.55em;
      max-width: none;
    }

    .content h1 { font-size: 2.35rem; }
    .content h2 { font-size: 1.75rem; }
    .content h3 { font-size: 1.35rem; }
    .content h4 { font-size: 1.12rem; }

    .content p,
    .content li,
    .content blockquote {
      font-size: 1rem;
      color: #304050;
    }

    .content p {
      margin: 0 0 1rem;
    }

    .content ul,
    .content ol {
      margin: 0 0 1rem 1.4rem;
      padding: 0;
    }

    .content li + li {
      margin-top: 0.3rem;
    }

    .content blockquote {
      margin: 1rem 0;
      padding: 0.9rem 1rem;
      background: var(--note);
      border-left: 4px solid var(--accent-2);
      border-radius: 10px;
    }

    .content hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 1.5rem 0;
    }

    .content code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #f3f6f9;
      color: #264a6e;
      border-radius: 6px;
      padding: 0.14rem 0.38rem;
      font-size: 0.92em;
    }

    .content pre {
      margin: 1rem 0;
      padding: 14px;
      background: var(--code-bg);
      color: var(--code-text);
      border-radius: 14px;
      overflow-x: auto;
    }

    .content pre code {
      background: transparent;
      color: inherit;
      padding: 0;
    }

    .content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0 1.2rem;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid var(--line);
      display: block;
      overflow-x: auto;
    }

    .content thead {
      background: var(--table-head);
    }

    .content th,
    .content td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      min-width: 120px;
    }

    .content a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .content a:hover {
      text-decoration: underline;
    }

    .content strong {
      color: #1f3247;
    }

    .empty,
    .error {
      padding: 40px 22px;
      text-align: center;
      color: var(--muted);
    }

    .error strong {
      display: block;
      color: #8c4024;
      margin-bottom: 8px;
      font-size: 1.1rem;
    }

    @media (max-width: 760px) {
      .page {
        padding: 12px;
      }

      .hero,
      .viewer {
        border-radius: 18px;
      }

      .content {
        padding: 20px 16px 26px;
      }

      .content h1 { font-size: 1.9rem; }
      .content h2 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="eyebrow">AstraNotes Documentation Viewer</div>
      <h1 id="viewer-title">Loading document</h1>
      <p id="viewer-subtitle">Rendering Markdown as browser-friendly HTML for faster review.</p>
      <div class="hero-actions">
        <a class="btn" id="back-link" href="sdlc-document-map.html">Back to SDLC Map</a>
        <a class="btn secondary" id="source-link" href="#">Open Markdown Source</a>
      </div>
      <div class="hero-meta">
        <div class="pill" id="source-pill">Source: —</div>
      </div>
    </header>

    <section class="viewer">
      <div class="viewer-head" id="viewer-head">Preparing HTML view...</div>
      <article class="content" id="content">
        <div class="empty">Loading document content...</div>
      </article>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sourceParam = params.get('source');
    const titleParam = params.get('title');
    const revisionParam = params.get('rev') || `${Date.now()}`;

    const titleNode = document.getElementById('viewer-title');
    const subtitleNode = document.getElementById('viewer-subtitle');
    const headNode = document.getElementById('viewer-head');
    const contentNode = document.getElementById('content');
    const sourceLink = document.getElementById('source-link');
    const sourcePill = document.getElementById('source-pill');

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function slugify(text) {
      return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }

    function resolveRelativeTarget(target, sourceUrl) {
      try {
        return new URL(target, sourceUrl).toString();
      } catch {
        return target;
      }
    }

    function toViewerLink(target, sourceUrl) {
      const resolved = new URL(target, sourceUrl);
      const relative = `${resolved.pathname.replace(/.*\/AstraNote\//, '')}`;
      const fromDocs = relative.startsWith('docs/') ? relative.slice(5) : `../${relative}`;
      const label = target.split('/').pop();
      return `markdown-viewer.html?source=${encodeURIComponent(fromDocs)}&title=${encodeURIComponent(label)}&rev=${encodeURIComponent(`${Date.now()}`)}`;
    }

    function renderInline(text, sourceUrl) {
      let html = escapeHtml(text);

      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => {
        if (href.endsWith('.md')) {
          return `<a href="${toViewerLink(href, sourceUrl)}">${label}</a>`;
        }
        return `<a href="${resolveRelativeTarget(href, sourceUrl)}">${label}</a>`;
      });

      return html;
    }

    function consumeParagraph(lines, start, sourceUrl) {
      const parts = [];
      let index = start;
      while (index < lines.length && lines[index].trim() !== '') {
        const line = lines[index];
        if (/^(#{1,6})\s+/.test(line) || /^```/.test(line) || /^>\s?/.test(line) || /^[-*+]\s+/.test(line) || /^\d+\.\s+/.test(line) || /^---+$/.test(line.trim())) {
          break;
        }
        parts.push(line.trim());
        index += 1;
      }
      if (parts.length === 0) {
        return { html: `<p>${renderInline(lines[start].trim(), sourceUrl)}</p>`, next: start + 1 };
      }
      return { html: `<p>${renderInline(parts.join(' '), sourceUrl)}</p>`, next: index };
    }

    function consumeList(lines, start, sourceUrl, ordered) {
      const tag = ordered ? 'ol' : 'ul';
      const matcher = ordered ? /^\d+\.\s+(.*)$/ : /^[-*+]\s+(.*)$/;
      const items = [];
      let index = start;
      while (index < lines.length) {
        const match = lines[index].match(matcher);
        if (!match) {
          break;
        }
        items.push(`<li>${renderInline(match[1], sourceUrl)}</li>`);
        index += 1;
      }
      return { html: `<${tag}>${items.join('')}</${tag}>`, next: index };
    }

    function isTableSeparator(line) {
      const trimmed = line.trim();
      return /^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(trimmed);
    }

    function parseTableRow(line) {
      const trimmed = line.trim().replace(/^\|/, '').replace(/\|$/, '');
      return trimmed.split('|').map((cell) => cell.trim());
    }

    function consumeTable(lines, start, sourceUrl) {
      const header = parseTableRow(lines[start]);
      let index = start + 2;
      const bodyRows = [];
      while (index < lines.length && /^\|/.test(lines[index].trim())) {
        bodyRows.push(parseTableRow(lines[index]));
        index += 1;
      }

      const thead = `<thead><tr>${header.map((cell) => `<th>${renderInline(cell, sourceUrl)}</th>`).join('')}</tr></thead>`;
      const tbody = `<tbody>${bodyRows.map((row) => `<tr>${row.map((cell) => `<td>${renderInline(cell, sourceUrl)}</td>`).join('')}</tr>`).join('')}</tbody>`;
      return { html: `<table>${thead}${tbody}</table>`, next: index };
    }

    function renderMarkdown(markdown, sourceUrl) {
      if (!window.marked || typeof window.marked.parse !== 'function') {
        return `<pre><code>${escapeHtml(markdown)}</code></pre>`;
      }

      const rawHtml = window.marked.parse(markdown, {
        gfm: true,
        breaks: true,
      });

      const wrapper = document.createElement('div');
      wrapper.innerHTML = rawHtml;

      wrapper.querySelectorAll('a[href]').forEach((anchor) => {
        const href = anchor.getAttribute('href') || '';
        if (href.endsWith('.md')) {
          anchor.setAttribute('href', toViewerLink(href, sourceUrl));
        } else {
          anchor.setAttribute('href', resolveRelativeTarget(href, sourceUrl));
        }
      });

      wrapper.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach((heading) => {
        const text = heading.textContent || '';
        if (text && !heading.id) {
          heading.id = slugify(text);
        }
      });

      return wrapper.innerHTML || '<div class="empty">This document is empty.</div>';
    }

    async function load() {
      if (!sourceParam) {
        titleNode.textContent = 'No document selected';
        subtitleNode.textContent = 'Open this viewer from the SDLC document map using an Open HTML button.';
        headNode.textContent = 'Missing source parameter';
        contentNode.innerHTML = '<div class="error"><strong>No source provided</strong>Add a source query parameter to render a Markdown document.</div>';
        sourceLink.style.display = 'none';
        return;
      }

      const sourceUrl = new URL(sourceParam, window.location.href);
      sourceUrl.searchParams.set('rev', revisionParam);
      const filename = sourceParam.split('/').pop();
      const title = titleParam || filename.replace(/\.md$/i, '').replace(/[-_]+/g, ' ');

      titleNode.textContent = title;
      subtitleNode.textContent = 'Browser-friendly HTML view generated from the current Markdown source.';
      headNode.textContent = `Rendering ${sourceParam}`;
      sourceLink.href = `${sourceParam}${sourceParam.includes('?') ? '&' : '?'}rev=${encodeURIComponent(revisionParam)}`;
      sourcePill.textContent = `Source: ${sourceParam}`;

      try {
        const response = await fetch(sourceUrl, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const markdown = await response.text();
        contentNode.innerHTML = renderMarkdown(markdown, sourceUrl);
      } catch (error) {
        contentNode.innerHTML = `<div class="error"><strong>Document could not be loaded</strong>${escapeHtml(String(error.message || error))}</div>`;
        headNode.textContent = 'Load failed';
      }
    }

    load();
  </script>
</body>
</html>
