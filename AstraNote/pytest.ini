[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    unit: marks tests as unit tests (deselect with '-m "not unit"')
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    feature: marks tests as feature/BDD tests (deselect with '-m "not feature"')
    performance: marks tests as performance verification (deselect with '-m "not performance"')
    slow: marks tests as slow (deselect with '-m "not slow"')
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing:skip-covered
    --cov-report=html
filterwarnings =
    ignore::DeprecationWarning
